name: Publish Rulemaster to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rulemaster-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: node tests/core.cjs && node tests/scenarios.cjs && node tests/expanded.cjs && node tests/roll.cjs && node tests/setup_focus.cjs
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_site.py dist
      - run: RULEMASTER_HTML=dist/index.html python tests/practice_guide_browser.py
      - run: RULEMASTER_HTML=dist/index.html python tests/lesson_motion_browser.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
