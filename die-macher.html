<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디마허 · 테이블 튜토리얼</title>
<link rel="stylesheet" href="app/style.css"></head>
<body><div class="shell"><header><div><div class="eyebrow">BOARDGAME TUTORIAL · v0.3.0</div><h1>디마허 <span class="muted">/ 테이블 튜토리얼</span></h1></div><div class="tools"><button onclick="location.href='index.html'">게임 목록</button><button onclick="location.href='practice.html'">체험 학습</button><button id="mode" aria-pressed="false">빠른 진행</button><button id="replay">다시 읽기</button><button id="voice" aria-pressed="false">음성 안내 OFF</button><button id="full">전체화면</button><button id="reset">새 게임</button></div></header>
<div class="rounds" id="rounds" aria-label="라운드 진행"></div><nav class="phases" id="phases" aria-label="현재 라운드 단계"></nav>
<div class="layout"><main class="card"><div class="stage" id="stage"></div><h2 class="headline" id="headline"></h2><p class="lead" id="lead"></p><div class="checks" id="checks"></div><div class="notice" id="notice"></div><p id="skipNotice" class="small muted" role="status"></p><details id="reference"><summary>규칙서 및 사용 안내</summary><p class="small">2019년 개정 영문 규칙서 기준의 검증 전 프로토타입. 한국어판 용어 및 예외 규칙은 실제 규칙서와 대조해야 합니다. <a href="https://sde0b16cbef51efc3.jimcontent.com/download/version/1699085059/module/13867387727/name/Die_Macher_Rules_EN_Final.pdf" target="_blank" rel="noopener">출판사 영문 규칙서</a> · <span id="page"></span></p><p class="small">실제 말, 카드, 돈 및 기록지는 보드게임 구성품을 사용합니다. 체크는 공용 진행 확인용입니다. 도식은 실물 구성품을 복제하지 않은 설명용 예시입니다.</p></details></main>
<aside class="card visual"><h2>한눈에 보기</h2><div id="diagram" class="flow"></div><div id="illustration" class="illustration" aria-label="단계별 구성품 예시"></div><div id="calculator" class="calc hidden"><label>전환할 유세 수<input id="rallies" type="number" min="0" max="8" value="4" step="1"></label><label>정당 추세<input id="trend" type="number" min="-3" max="4" value="2" step="1"></label><label>여론 일치 점수 합계<input id="match" type="number" min="-5" max="5" value="2" step="1"></label><label>지역 구분<select id="election"><option value="yes">이번 선거 지역</option><option value="no">나중 선거 지역</option></select></label><div class="result" id="votes" aria-live="polite"></div><div class="small muted" id="calcNote"></div></div><p class="rule" id="diagramNote"></p></aside></div></div>
<footer class="footer"><button id="prev">← 이전</button><div class="progress" id="progress" aria-live="polite"></div><button class="primary" id="next">다음 단계 →</button></footer>
<script src="games/die-macher.js"></script>
<script src="app/visuals.js"></script>
<script src="app/engine.js"></script>
<script>for(const a of document.querySelectorAll('[data-hub]'))a.addEventListener('click',e=>{if(parent!==window){e.preventDefault();parent.postMessage({kind:'rulemaster-route',route:a.dataset.hub},'*')}});</script></body></html>
