<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>디마허 | 체험 튜토리얼</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#24312e;background:#f4f3ee;font-size:16px;--green:#28634e;--line:#d8ded6;--ink:#24312e;--blue:#3265ad;--red:#c76059;--yellow:#bf963f}*{box-sizing:border-box}body{margin:0}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #3295d7;outline-offset:3px}a{color:var(--green)}.wrap{max-width:1100px;margin:auto;padding:24px 24px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--green)}h1{font-size:clamp(24px,4vw,34px);margin:5px 0}.sub{color:#64746d;font-size:14px}.nav{display:flex;gap:8px;flex-wrap:wrap}.ghost{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 14px;color:var(--ink);text-decoration:none;font-weight:650}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.segment{border:0;border-radius:8px;padding:11px 8px;font-weight:700;color:#6b7871;background:#e4e7df;font-size:14px}.segment.current{color:white;background:var(--green)}.segment.done{color:var(--green);background:#dbe9df}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}.panel{border:1px solid var(--line);border-radius:18px;background:#fff;padding:22px;box-shadow:0 5px 18px #17332308}.label{font-weight:800;color:var(--green);font-size:12px;letter-spacing:.12em}h2{font-size:26px;line-height:1.25;margin:8px 0 12px}h3{margin:0 0 12px;font-size:18px}.hint{color:#52645c;line-height:1.55;margin:8px 0 20px}.board{display:grid;grid-template-columns:1fr 1fr;gap:12px}.region{border:1px solid #cdd7ca;border-radius:12px;background:#f3f6ee;padding:13px;min-width:0}.region h3{font-size:16px;margin:0 0 5px}.region small{color:#66786b}.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:16px}.slot{aspect-ratio:1;min-width:0;border:1px dashed #92a197;border-radius:50%;background:#fff;display:grid;place-items:center;padding:4px;color:#527361;font-weight:800}.slot.empty{border:2px dashed #6c9980;color:#28634e;animation:pulse 2.3s infinite}.slot.filled{border:1px solid #c8d1c7;animation:none}.piece{display:grid;place-items:center;width:100%;aspect-ratio:1;color:white;border-radius:28%;font-size:13px;box-shadow:inset 0 -3px #0002;font-weight:800}.B{background:var(--blue)}.R{background:var(--red)}.Y{background:var(--yellow)}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:#52645c;margin-top:16px}.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}.statusline{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:9px 0}.statusline strong{font-size:18px;font-variant-numeric:tabular-nums}.feedback{border-radius:10px;background:#f0f4ee;padding:15px;line-height:1.55;margin:15px 0;color:#43584c;min-height:75px}.feedback.good{background:#e4f3e8;color:#20573b}.feedback.bad{background:#f9ece5;color:#854b31}.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:13px 16px;font-weight:800;width:100%;font-size:16px}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1;text-align:center}.cubegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.cube{aspect-ratio:1;border:1px dashed #b6c1b3;border-radius:5px;background:#fff;display:grid;place-items:center;font-size:12px;color:white}.cube.owned{background:#345f96;border:0;box-shadow:inset 0 -4px #0002}.cube.new{background:#499c75;border:0;box-shadow:inset 0 -4px #0002}.adjust{display:flex;align-items:center;justify-content:space-between;gap:8px}.adjust button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:20px;width:38px;height:38px;font-weight:800}.choice{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:left;padding:14px;font-weight:700;margin:8px 0}.choice:hover{border-color:var(--green)}.choice.correct{border:2px solid var(--green);background:#e9f3e9}.costtable{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:15px}.price{padding:7px 3px;background:#f5f6f2;border-radius:6px;text-align:center;font-size:12px;color:#52645c}.price b{display:block;color:var(--ink)}.foot{color:#67766d;font-size:12px;line-height:1.5;margin-top:18px}.completion{text-align:center;padding:30px 15px}.completion h2{font-size:30px}.checkmark{font-size:48px;color:var(--green)}@keyframes pulse{50%{box-shadow:0 0 0 3px #80b49533}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:700px){.wrap{padding:16px}header{flex-direction:column;align-items:flex-start}.layout{grid-template-columns:1fr}.panel{padding:16px}.board{gap:8px}.region{padding:10px}.segment{font-size:12px}h2{font-size:23px}.slots{gap:3px}.piece{font-size:10px}.statusline strong{font-size:16px}}
</style></head>
<body><main class="wrap"><header><div><div class="brand">BOARDGAME TUTORIAL · v0.3.0</div><h1>디마허 <span style="font-weight:400;color:#6b7972">/ 체험 학습</span></h1><div class="sub">실물 게임 전에, 핵심 행동부터 연습해 보세요.</div></div><div class="nav"><a class="ghost" href="die-macher.html">실전 진행 모드</a><button class="ghost" id="restart">처음부터</button></div></header><nav class="progress" id="progress" aria-label="학습 단계"></nav><div id="content"></div><footer class="foot">2019 Spielworxx 개정판 영문 규칙서 9쪽 기준의 부분 체험판. 한국어판 용어 및 전체 규칙 대조 전이며, 모든 보드 그림과 수치는 학습용 예시입니다. <a href="https://sde0b16cbef51efc3.jimcontent.com/download/version/1699085059/module/13867387727/name/Die_Macher_Rules_EN_Final.pdf" target="_blank" rel="noopener">규칙서</a></footer></main>
<script>
'use strict';
const chapters=['언론 마커 놓기','언론 우세 판단','선거 유세 구매'];
const prices=[0,1000,2000,3000,5000,7000,10000,15000,20000];
const money=n=>'€'+n.toLocaleString('en-US');
const fresh=()=>({chapter:0,media:['B','R','Y',null,null],mediaFull:['B','B','R','R','Y'],cash:15000,mediaPlaced:false,answer:null,amounts:[0,0],bought:false,finished:false});
let s=fresh(), msg='',kind='';
const $=id=>document.getElementById(id);
const lessonDone=()=>s.chapter===0?s.mediaPlaced:s.chapter===1?s.answer==='B':s.bought;
function feedback(text,type=''){msg=text;kind=type;render()}
function step(n){s.chapter=n;msg='';kind='';render()}
function restart(){s=fresh();msg='';kind='';render()}
function place(region,i){if(s.mediaPlaced)return;if(region!==0||s.media[i]!==null){feedback('이미 마커가 있는 칸에는 놓을 수 없어요. 지역 A의 빈칸을 선택해 봐요.','bad');return;}s.media[i]='B';s.mediaPlaced=true;s.cash-=5000;feedback('좋아요! 5,000유로를 내고 파란 정당의 언론 마커를 빈칸에 놓았어요. 이번 행동에서는 한 개만 구매해요.','good')}
function answer(x){if(s.answer==='B')return;s.answer=x;feedback(x==='B'?'정답! 파랑 2개, 빨강 1개, 노랑 1개. 파랑이 단독 최다예요. 이후 언론 영향력 단계에서 여론 변경 권한을 판단해요.':'지역 A의 마커 개수를 다시 세어 보세요. 동률이 아니라 다른 정당보다 많이 가진 정당이 우세해요.',x==='B'?'good':'bad')}
function total(){return prices[s.amounts[0]]+prices[s.amounts[1]]}
function adjust(i,n){if(s.bought)return;const a=s.amounts[i]+n;const capacity=[3,6][i];if(a<0||a>capacity)return;s.amounts[i]=a;msg='';kind='';render()}
function buy(){if(s.bought)return;if(s.amounts[0]!==3||s.amounts[1]!==2){feedback('이번 연습의 목표는 A에 3개, B에 2개를 추가하는 거예요. 수량을 다시 맞춰 보세요.','bad');return;}if(total()>s.cash){feedback('자금이 부족해요.','bad');return;}s.cash-=total();s.bought=true;feedback('성공! A는 €3,000, B는 €2,000. 지역별 비용을 합쳐 €5,000을 지불했어요. A의 유세 8칸이 모두 찼어요.','good')}
const region=(name,arr,r)=>`<section class="region"><h3>지역 ${name}</h3><small>언론 칸 ${arr.filter(Boolean).length}/5</small><div class="slots">${arr.map((x,i)=>`<button class="slot ${x?'filled':'empty'}" aria-label="지역 ${name} 언론 칸 ${i+1} ${x||'빈칸'}" data-region="${r}" data-slot="${i}" ${s.chapter!==0||s.mediaPlaced?'disabled':''}>${x?`<span class="piece ${x}">${{B:'파',R:'빨',Y:'노'}[x]}</span>`:'+'}</button>`).join('')}</div></section>`;
const mediaBoard=()=>`<div class="board">${region('A',s.media,0)}${region('B',s.mediaFull,1)}</div><div class="legend"><span><i class="dot B"></i>내 정당 (파랑)</span><span><i class="dot R"></i>빨강</span><span><i class="dot Y"></i>노랑</span></div>`;
function rallyBoard(){return `<div class="board">${[0,1].map(i=>{const start=[5,2][i],n=s.amounts[i];return `<section class="region"><h3>지역 ${['A','B'][i]}</h3><small>유세 ${start+n}/8</small><div class="cubegrid">${Array.from({length:8},(_,j)=>`<div class="cube ${j<start?'owned':j<start+n?'new':''}">${j<start?'●':j<start+n?'+':''}</div>`).join('')}</div><div class="adjust"><button data-i="${i}" data-n="-1" aria-label="지역 ${i===0?'A':'B'} 유세 줄이기" ${n===0||s.bought?'disabled':''}>−</button><strong>+${n}개</strong><button data-i="${i}" data-n="1" aria-label="지역 ${i===0?'A':'B'} 유세 늘리기" ${n===8-start||s.bought?'disabled':''}>+</button></div><p class="sub">지역 비용 ${money(prices[n])}</p></section>`}).join('')}</div><div class="legend"><span><i class="dot" style="background:#345f96"></i>기존 유세</span><span><i class="dot" style="background:#499c75"></i>추가할 유세</span></div><div class="costtable">${prices.slice(1).map((p,i)=>`<div class="price"><b>${i+1}개</b>${money(p)}</div>`).join('')}</div>`}
const data=[{title:'언론 마커를 직접 놓아 보자',hint:'파란 정당을 맡았어요. 언론 마커를 하나 구매하려면 어느 빈칸에 놓아야 할까요?',goal:'지역 A의 빈 언론 칸 하나를 클릭하세요.',reason:'언론 칸은 지역마다 5개이고, 마커가 이미 있는 칸에 추가할 수 없어요.',board:mediaBoard},{title:'누가 언론을 주도할까?',hint:'방금 배치한 마커를 보고, 지역 A의 언론 마커가 가장 많은 정당을 골라 보세요.',goal:'단독으로 가장 많이 가진 정당을 찾아요.',reason:'언론 우세는 이후 여론에 영향을 줄 수 있는 권한과 관련돼요.',board:mediaBoard},{title:'유세에 자금을 투자하자',hint:'지역 A에 유세 3개, 지역 B에 유세 2개를 추가하세요. 각 지역의 구매 비용을 따로 계산해요.',goal:'수량을 조절한 뒤 구매 확정 버튼을 눌러요.',reason:'지역별 정당 유세는 최대 8개예요. 구매 단가는 수량에 따라 달라져요.',board:rallyBoard}];
function render(){
 $('progress').innerHTML=chapters.map((x,i)=>`<button class="segment ${s.finished||i<s.chapter?'done':i===s.chapter?'current':''}" ${i!==s.chapter?'disabled':''} aria-current="${i===s.chapter?'step':'false'}">${i+1}. ${x}</button>`).join('');
 if(s.finished){$('content').innerHTML=`<section class="panel completion"><div class="checkmark">✓</div><h2>핵심 행동 연습 완료!</h2><p class="hint">언론 확보, 언론 우세 판단, 유세 구매를 직접 해 봤어요.<br>다음 단계는 실제 보드의 초기 배치와 한 라운드 전체 연습이에요.</p><div class="actions"><button class="ghost" id="again">다시 연습</button><a class="ghost" href="die-macher.html">실전 진행 모드 →</a></div></section>`;$('again').onclick=restart;return;}
 const d=data[s.chapter];
 $('content').innerHTML=`<div class="layout"><section class="panel"><div class="label">MISSION ${String(s.chapter+1).padStart(2,'0')}</div><h2>${d.title}</h2><p class="hint">${d.hint}</p>${d.board()}${s.chapter===1?`<div style="margin-top:20px"><h3>지역 A에서 단독 최다는?</h3>${[['B','파랑 정당'],['R','빨강 정당'],['Y','노랑 정당'],['T','동률 / 아무도 없음']].map(([v,l])=>`<button class="choice ${s.answer===v&&v==='B'?'correct':''}" data-answer="${v}" ${s.answer==='B'?'disabled':''}>${l}</button>`).join('')}</div>`:''}</section><aside class="panel"><div class="label">지금 할 일</div><h3 style="margin-top:10px">${d.goal}</h3><div class="statusline"><span>예시 자금 잔액</span><strong>${money(s.cash)}</strong></div>${s.chapter===0?'<div class="statusline"><span>마커 구매 비용</span><strong>€5,000</strong></div>':s.chapter===2?`<div class="statusline"><span>${s.bought?'지불 완료':'구매 예정'}</span><strong>${money(total())}</strong></div>`:''}<div class="feedback ${kind}" role="status" aria-live="polite">${msg||d.reason}</div>${s.chapter===2&&!s.bought?'<button class="primary" id="buy">구매 확정</button>':`<button class="primary" id="next" ${lessonDone()?'':'disabled'}>${s.chapter===2?'연습 완료':'다음 미션 →'}</button>`}<p class="foot">연습 상황은 가상의 예시이며, 실제 게임의 자금이나 비공개 정보를 입력하지 않아요.</p></aside></div>`;
 document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>place(+b.dataset.region,+b.dataset.slot));document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>adjust(+b.dataset.i,+b.dataset.n));if($('buy'))$('buy').onclick=buy;if($('next'))$('next').onclick=()=>{if(!lessonDone())return;if(s.chapter===2){s.finished=true;render()}else step(s.chapter+1)};
}
$('restart').onclick=restart;render();
</script><script>for(const a of document.querySelectorAll('[data-hub]'))a.addEventListener('click',e=>{if(parent!==window){e.preventDefault();parent.postMessage({kind:'rulemaster-route',route:a.dataset.hub},'*')}});</script></body></html>
